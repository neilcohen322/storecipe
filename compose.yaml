name: storecipe

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-storecipe}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-storecipe_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-local_admin_only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    # Disposable cache/rate-limit Redis. The Celery broker uses redis-broker.
    command:
      - redis-server
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - volatile-lru
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis-broker:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
    volumes:
      - redis-broker-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  catalog-api:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    environment:
      CATALOG_DATABASE_URL: ${CATALOG_DATABASE_URL:-postgresql+asyncpg://catalog_app:local_catalog_only@postgres:5432/storecipe}
      CATALOG_REDIS_URL: ${CATALOG_REDIS_URL:-redis://redis:6379}
      CATALOG_REDIS_TIMEOUT_SECONDS: ${CATALOG_REDIS_TIMEOUT_SECONDS:-1}
      CATALOG_RECIPE_QUERY_CACHE_TTL_SECONDS: ${CATALOG_RECIPE_QUERY_CACHE_TTL_SECONDS:-1800}
      CATALOG_CORS_ORIGINS: ${CATALOG_CORS_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081}
      AUTH0_ISSUER: ${AUTH0_ISSUER:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
      AUTH0_JWKS_URL: ${AUTH0_JWKS_URL:-}
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL:-http://localhost/mcp}
    ports:
      - "${CATALOG_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mcp-gateway:
    build:
      context: .
      dockerfile: services/mcp_gateway/Dockerfile
    environment:
      MCP_CATALOG_API_URL: ${MCP_CATALOG_API_URL:-http://catalog-api:8000}
      MCP_CATALOG_MAX_RESPONSE_BYTES: ${MCP_CATALOG_MAX_RESPONSE_BYTES:-2097152}
      MCP_CONNECT_TIMEOUT_SECONDS: ${MCP_CONNECT_TIMEOUT_SECONDS:-5}
      MCP_POOL_TIMEOUT_SECONDS: ${MCP_POOL_TIMEOUT_SECONDS:-5}
      MCP_READ_TIMEOUT_SECONDS: ${MCP_READ_TIMEOUT_SECONDS:-10}
      MCP_WRITE_TIMEOUT_SECONDS: ${MCP_WRITE_TIMEOUT_SECONDS:-10}
      AUTH0_ISSUER: ${AUTH0_ISSUER:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
      AUTH0_JWKS_URL: ${AUTH0_JWKS_URL:-}
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL:-http://localhost/mcp}
      MCP_OBO_CLIENT_ID: ${MCP_OBO_CLIENT_ID:-}
      MCP_OBO_CLIENT_SECRET: ${MCP_OBO_CLIENT_SECRET:-}
      MCP_OBO_TOKEN_URL: ${MCP_OBO_TOKEN_URL:-}
      MCP_OBO_EXPIRY_MARGIN_SECONDS: ${MCP_OBO_EXPIRY_MARGIN_SECONDS:-30}
    ports:
      - "${MCP_PORT:-8002}:8002"
    depends_on:
      catalog-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ingestion-api:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    environment: &ingestion-common
      INGESTION_DATABASE_URL: ${INGESTION_DATABASE_URL:-postgresql+asyncpg://ingestion_app:local_ingestion_only@postgres:5432/storecipe}
      INGESTION_REDIS_URL: ${INGESTION_REDIS_URL:-redis://redis:6379}
      INGESTION_CELERY_BROKER_URL: ${INGESTION_CELERY_BROKER_URL:-redis://redis-broker:6379/0}
      INGESTION_IMPORT_DEADLINE_SECONDS: ${INGESTION_IMPORT_DEADLINE_SECONDS:-900}
      INGESTION_PAYLOAD_ACTIVE_KEY_ID: ${INGESTION_PAYLOAD_ACTIVE_KEY_ID:-local}
      INGESTION_PAYLOAD_KEYRING: ${INGESTION_PAYLOAD_KEYRING:-local=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      INGESTION_IMPORT_BURST_REQUESTS: ${INGESTION_IMPORT_BURST_REQUESTS:-5}
      INGESTION_IMPORT_BURST_WINDOW_SECONDS: ${INGESTION_IMPORT_BURST_WINDOW_SECONDS:-60}
      # Shared by the Ingestion API source lookup and worker Catalog handoff.
      CATALOG_API_URL: ${CATALOG_API_URL:-http://catalog-api:8000}
      CATALOG_M2M_TOKEN_URL: ${CATALOG_M2M_TOKEN_URL:-}
      CATALOG_M2M_CLIENT_ID: ${CATALOG_M2M_CLIENT_ID:-}
      CATALOG_M2M_CLIENT_SECRET: ${CATALOG_M2M_CLIENT_SECRET:-}
      CATALOG_M2M_AUDIENCE: ${CATALOG_M2M_AUDIENCE:-}
      AUTH0_ISSUER: ${AUTH0_ISSUER:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
      AUTH0_JWKS_URL: ${AUTH0_JWKS_URL:-}
      INGESTION_CORS_ORIGINS: ${INGESTION_CORS_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081}
    ports:
      - "${INGESTION_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ingestion-worker:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    command: ["celery", "-A", "ingestion.worker:celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    environment:
      <<: *ingestion-common
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-5.6-luna}
      AI_EXTRACTION_ENABLED: ${AI_EXTRACTION_ENABLED:-false}
      INGESTION_AI_DAILY_TOKEN_LIMIT: ${INGESTION_AI_DAILY_TOKEN_LIMIT:-1100000}
      INGESTION_AI_INVOCATION_RESERVATION_TOKENS: ${INGESTION_AI_INVOCATION_RESERVATION_TOKENS:-275000}
    depends_on:
      postgres:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
    restart: unless-stopped

  ingestion-dispatcher:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    command: ["python", "-m", "ingestion.dispatcher"]
    environment: *ingestion-common
    depends_on:
      postgres:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
    restart: unless-stopped

  ingestion-reconciler:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    command: ["python", "-m", "ingestion.reconciler"]
    environment: *ingestion-common
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-broker-data:
