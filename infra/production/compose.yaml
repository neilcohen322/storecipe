name: storecipe-production

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-ingestion-environment: &ingestion-environment
  INGESTION_DATABASE_URL: ${INGESTION_DATABASE_URL:?required}
  INGESTION_REDIS_URL: redis://redis-cache:6379/0
  INGESTION_CELERY_BROKER_URL: redis://redis-broker:6379/0
  INGESTION_IMPORT_DEADLINE_SECONDS: ${INGESTION_IMPORT_DEADLINE_SECONDS:-900}
  INGESTION_IMPORT_BURST_REQUESTS: ${INGESTION_IMPORT_BURST_REQUESTS:-5}
  INGESTION_IMPORT_BURST_WINDOW_SECONDS: ${INGESTION_IMPORT_BURST_WINDOW_SECONDS:-60}
  INGESTION_PAYLOAD_ACTIVE_KEY_ID: ${INGESTION_PAYLOAD_ACTIVE_KEY_ID:?required}
  INGESTION_PAYLOAD_KEYRING: ${INGESTION_PAYLOAD_KEYRING:?required}
  INGESTION_CORS_ORIGINS: ${PUBLIC_ORIGIN:?required}
  CATALOG_API_URL: http://catalog-api:8000
  CATALOG_M2M_TOKEN_URL: ${CATALOG_M2M_TOKEN_URL:?required}
  CATALOG_M2M_CLIENT_ID: ${CATALOG_M2M_CLIENT_ID:?required}
  CATALOG_M2M_CLIENT_SECRET: ${CATALOG_M2M_CLIENT_SECRET:?required}
  CATALOG_M2M_AUDIENCE: ${AUTH0_AUDIENCE:?required}
  AUTH0_ISSUER: ${AUTH0_ISSUER:?required}
  AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:?required}
  AUTH0_JWKS_URL: ${AUTH0_JWKS_URL:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?required}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-5.6-luna}
  AI_EXTRACTION_ENABLED: ${AI_EXTRACTION_ENABLED:-true}

services:
  edge:
    <<: *service-defaults
    image: ${STORECIPE_WEB_IMAGE:?full web image digest is required}
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      catalog-api:
        condition: service_healthy
      ingestion-api:
        condition: service_healthy
      mcp-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 48m
    mem_reservation: 32m
    stop_grace_period: 15s

  postgres:
    <<: *service-defaults
    image: postgres:17-alpine
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_DB: storecipe
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?required}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?required}
      INGESTION_DB_PASSWORD: ${INGESTION_DB_PASSWORD:?required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 256m
    mem_reservation: 160m
    stop_grace_period: 60s

  redis-cache:
    <<: *service-defaults
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 112m
    mem_reservation: 48m
    stop_grace_period: 10s

  redis-broker:
    <<: *service-defaults
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "160mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes:
      - redis-broker-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 192m
    mem_reservation: 96m
    stop_grace_period: 30s

  catalog-api:
    <<: *service-defaults
    image: ${STORECIPE_CATALOG_IMAGE:?full catalog image digest is required}
    environment:
      CATALOG_DATABASE_URL: ${CATALOG_DATABASE_URL:?required}
      CATALOG_REDIS_URL: redis://redis-cache:6379/0
      CATALOG_REDIS_TIMEOUT_SECONDS: ${CATALOG_REDIS_TIMEOUT_SECONDS:-1}
      CATALOG_RECIPE_QUERY_CACHE_TTL_SECONDS: ${CATALOG_RECIPE_QUERY_CACHE_TTL_SECONDS:-1800}
      CATALOG_MUTATION_BURST_REQUESTS: ${CATALOG_MUTATION_BURST_REQUESTS:-30}
      CATALOG_MUTATION_BURST_WINDOW_SECONDS: ${CATALOG_MUTATION_BURST_WINDOW_SECONDS:-60}
      CATALOG_MEDIA_BUCKET: ${CATALOG_MEDIA_BUCKET:?required}
      CATALOG_MEDIA_MAX_INPUT_BYTES: "8388608"
      CATALOG_MEDIA_MAX_PIXELS: "12000000"
      CATALOG_MEDIA_MAX_OUTPUT_BYTES: "1572864"
      CATALOG_CORS_ORIGINS: ${PUBLIC_ORIGIN:?required}
      AUTH0_ISSUER: ${AUTH0_ISSUER:?required}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:?required}
      AUTH0_JWKS_URL: ${AUTH0_JWKS_URL:-}
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL:?required}
    depends_on:
      postgres:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s
    mem_limit: 160m
    mem_reservation: 96m
    stop_grace_period: 30s

  catalog-migrate:
    extends:
      service: catalog-api
    profiles: ["migration"]
    restart: "no"
    command: ["alembic", "-c", "services/catalog/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  ingestion-api:
    <<: *service-defaults
    image: ${STORECIPE_INGESTION_IMAGE:?full ingestion image digest is required}
    environment: *ingestion-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
      catalog-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready')"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s
    mem_limit: 128m
    mem_reservation: 80m
    stop_grace_period: 30s

  ingestion-migrate:
    extends:
      service: ingestion-api
    profiles: ["migration"]
    restart: "no"
    command: ["alembic", "-c", "services/ingestion/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  ingestion-worker:
    <<: *service-defaults
    image: ${STORECIPE_INGESTION_IMAGE:?full ingestion image digest is required}
    command: ["celery", "-A", "ingestion.worker:celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    environment:
      <<: *ingestion-environment
      INGESTION_AI_DAILY_TOKEN_LIMIT: ${INGESTION_AI_DAILY_TOKEN_LIMIT:-1100000}
      INGESTION_AI_INVOCATION_RESERVATION_TOKENS: ${INGESTION_AI_INVOCATION_RESERVATION_TOKENS:-275000}
      INGESTION_SERVER_RENDERED_VARIANT_HOSTS_JSON: ${INGESTION_SERVER_RENDERED_VARIANT_HOSTS_JSON:-{}}
    depends_on:
      postgres:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
      catalog-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A ingestion.worker:celery_app inspect ping --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 192m
    mem_reservation: 112m
    stop_grace_period: 120s

  ingestion-dispatcher:
    <<: *service-defaults
    image: ${STORECIPE_INGESTION_IMAGE:?full ingestion image digest is required}
    command: ["python", "-m", "ingestion.dispatcher"]
    environment: *ingestion-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 3s
      retries: 5
    mem_limit: 64m
    mem_reservation: 40m
    stop_grace_period: 30s

  ingestion-reconciler:
    <<: *service-defaults
    image: ${STORECIPE_INGESTION_IMAGE:?full ingestion image digest is required}
    command: ["python", "-m", "ingestion.reconciler"]
    environment: *ingestion-environment
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 3s
      retries: 5
    mem_limit: 64m
    mem_reservation: 40m
    stop_grace_period: 30s

  mcp-gateway:
    <<: *service-defaults
    image: ${STORECIPE_MCP_IMAGE:?full MCP image digest is required}
    environment:
      MCP_CATALOG_API_URL: http://catalog-api:8000
      MCP_INGESTION_API_URL: http://ingestion-api:8001
      MCP_CATALOG_MAX_RESPONSE_BYTES: ${MCP_CATALOG_MAX_RESPONSE_BYTES:-2097152}
      AUTH0_ISSUER: ${AUTH0_ISSUER:?required}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:?required}
      AUTH0_JWKS_URL: ${AUTH0_JWKS_URL:-}
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL:?required}
      MCP_OBO_CLIENT_ID: ${MCP_OBO_CLIENT_ID:?required}
      MCP_OBO_CLIENT_SECRET: ${MCP_OBO_CLIENT_SECRET:?required}
      MCP_OBO_TOKEN_URL: ${MCP_OBO_TOKEN_URL:-}
      MCP_OBO_EXPIRY_MARGIN_SECONDS: ${MCP_OBO_EXPIRY_MARGIN_SECONDS:-30}
    depends_on:
      catalog-api:
        condition: service_healthy
      ingestion-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health/ready')"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s
    mem_limit: 96m
    mem_reservation: 56m
    stop_grace_period: 30s

volumes:
  postgres-data:
  redis-broker-data:
  caddy-data:
  caddy-config:
