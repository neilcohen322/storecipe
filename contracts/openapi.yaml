openapi: 3.1.0
info:
  title: Storecipe public API contract
  version: 0.3.0
  description: >-
    Public contract for recipes, ratings, deterministic recipe queries, and imports. The internal
    `POST /internal/recipes/source-lookup` endpoint is M2M-only and is excluded
    from the public proxy.
servers:
  - url: https://api.storecipe.example
security:
  - bearerAuth: []
paths:
  /v1/recipes:
    get:
      operationId: queryRecipes
      description: Requires the `recipes:read` scope.
      parameters:
        - {name: text, in: query, schema: {type: [string, "null"], maxLength: 200}}
        - name: ingredient
          in: query
          style: form
          explode: true
          description: Every listed value is required (AND).
          schema:
            type: array
            maxItems: 32
            items: {type: string, minLength: 1, maxLength: 200}
        - name: tag
          in: query
          style: form
          explode: true
          description: Every listed value is required (AND).
          schema:
            type: array
            maxItems: 16
            items: {type: string, minLength: 1, maxLength: 64}
        - {name: maxTotalMinutes, in: query, schema: {type: [integer, "null"], minimum: 0}}
        - {name: minRating, in: query, schema: {type: [integer, "null"], minimum: 1, maximum: 5}}
        - name: ratingState
          in: query
          schema: {type: string, enum: [any, rated, unrated], default: any}
        - name: sort
          in: query
          style: form
          explode: true
          description: Ordered sort precedence. The service appends its private recipeId tie-breaker.
          examples:
            ratingFirst:
              value: [rating:desc, totalMinutes:asc]
          schema:
            type: array
            maxItems: 6
            items: {$ref: "#/components/schemas/RecipeSort"}
        - {name: cursor, in: query, schema: {type: [string, "null"], maxLength: 1024}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        "200":
          description: User-owned recipes
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RecipeQueryPage"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "409": {$ref: "#/components/responses/StaleRecipeQueryCursor"}
        "414": {$ref: "#/components/responses/UriTooLong"}
    post:
      operationId: createRecipe
      description: Requires the `recipes:write` scope.
      parameters:
        - {$ref: "#/components/parameters/RecipeCreateIdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RecipeCreate"}
      responses:
        "201":
          description: Created recipe
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Recipe"}
        "200":
          description: Existing idempotent recipe replay
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Recipe"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/IdempotencyConflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /v1/recipes/{recipeId}:
    parameters:
      - {$ref: "#/components/parameters/RecipeId"}
    get:
      operationId: getRecipe
      description: Requires `recipes:read`; another user's recipe is reported as not found.
      responses:
        "200": {description: Recipe, content: {application/json: {schema: {$ref: "#/components/schemas/Recipe"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      operationId: updateRecipe
      description: Requires the `recipes:write` scope.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RecipePatch"}
      responses:
        "200": {description: Updated recipe, content: {application/json: {schema: {$ref: "#/components/schemas/Recipe"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
    delete:
      operationId: deleteRecipe
      description: Requires the `recipes:write` scope.
      responses:
        "204": {description: Deleted}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/recipes/{recipeId}/rating:
    parameters:
      - {$ref: "#/components/parameters/RecipeId"}
    put:
      operationId: rateRecipe
      description: Creates or replaces the authenticated user's rating; requires `ratings:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RatingInput"}
      responses:
        "200": {description: Rating saved, content: {application/json: {schema: {$ref: "#/components/schemas/Rating"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
    delete:
      operationId: deleteRating
      description: Idempotently removes the authenticated user's rating; requires `ratings:write`.
      responses:
        "204": {description: Rating removed}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/recipe-facets:
    get:
      operationId: listRecipeFacets
      description: Requires the `recipes:read` scope. Returns observed facet pages for the caller's recipes.
      parameters:
        - {name: ingredientLimit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 200}}
        - {name: tagLimit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 200}}
        - {name: ingredientCursor, in: query, schema: {type: [string, "null"], maxLength: 2048}}
        - {name: tagCursor, in: query, schema: {type: [string, "null"], maxLength: 2048}}
        - {name: ingredientQ, in: query, schema: {type: [string, "null"], maxLength: 200}}
        - {name: tagQ, in: query, schema: {type: [string, "null"], maxLength: 64}}
      responses:
        "200":
          description: Observed recipe-query facet pages for the authenticated user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RecipeFacetPage"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/StaleRecipeFacetCursor"}
        "414": {$ref: "#/components/responses/UriTooLong"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /v1/recipe-facet-selections:
    post:
      operationId: resolveRecipeFacetSelections
      description: Requires the `recipes:read` scope. Resolves requested names to Catalog canonical form and exact observed membership.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RecipeFacetSelectionsRequest"}
      responses:
        "200":
          description: Canonical names and observed membership for requested facet selections
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RecipeFacetSelectionsResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /v1/imports/url:
    post:
      operationId: importRecipeFromUrl
      description: >-
        Requires `recipes:write`. A matching idempotency replay returns the current
        job. The default Catalog source lookup rejects a saved recipe source with
        `recipe_source_exists` when `duplicatePolicy` is `warn`; `allow` permits
        that saved-recipe duplicate but cannot bypass an active URL import job.
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UrlImportRequest"}
      responses:
        "202":
          description: New durable import accepted
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ImportAccepted"}
        "200":
          description: Existing idempotent import
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ImportJob"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: >-
            `active_url_import_exists` includes `existingJobId`; `recipe_source_exists`
            includes `existingRecipeId`.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "429": {$ref: "#/components/responses/ImportBurstExceeded"}
        "503":
          description: The default Catalog source lookup is unavailable.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /v1/imports/text:
    post:
      operationId: importRecipeFromText
      description: Requires `recipes:write`. Text is limited to 256 KiB UTF-8.
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TextImportRequest"}
      responses:
        "202":
          description: New durable import accepted
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ImportAccepted"}
        "200":
          description: Existing idempotent import
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ImportJob"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/ImportBurstExceeded"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /v1/imports/{jobId}:
    parameters:
      - {name: jobId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getImportStatus
      description: Requires `recipes:read`; another user's job is reported as not found.
      responses:
        "200": {description: Import job status, content: {application/json: {schema: {$ref: "#/components/schemas/ImportJob"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      operationId: cancelImport
      description: Requires `recipes:write`; cancellation is cooperative once processing starts.
      responses:
        "204": {description: Queued or already-cancelled job is cancelled}
        "202":
          description: Cooperative cancellation requested
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ImportJob"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /v1/ingredient-normalizations:
    post:
      operationId: normalizeIngredients
      description: >-
        Requires `recipes:write` and a required `Idempotency-Key`. Accepts 1–256 raw
        ingredient lines with per-line and total UTF-8 byte caps. Replays the exact
        encrypted successful result for the same owner/key/request hash.
      parameters:
        - {$ref: "#/components/parameters/IngredientNormalizationIdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/IngredientNormalizationRequest"}
      responses:
        "200":
          description: New or exactly replayed successful normalization
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IngredientNormalizationResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/IngredientNormalizationRateLimited"}
        "502":
          description: Provider output violated the strict normalization contract.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "503":
          description: Provider/configuration unavailable or unresolved provider ambiguity.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RecipeId:
      name: recipeId
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: {type: string, minLength: 1, maxLength: 255}
    RecipeCreateIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$'}
    IngredientNormalizationIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 255}
  responses:
    Unauthorized:
      description: Missing or invalid access token
      headers:
        WWW-Authenticate:
          schema: {type: string}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Forbidden:
      description: Access token lacks a required scope
      headers:
        WWW-Authenticate:
          schema: {type: string}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    NotFound:
      description: Resource not found or not owned by the authenticated user
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    ValidationError:
      description: Request validation failed
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    UriTooLong:
      description: Raw query string exceeds 6144 bytes
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Conflict:
      description: Request conflicts with durable resource state
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    IdempotencyConflict:
      description: Idempotency key was already used for different recipe content
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
          example:
            type: https://docs.storecipe.example/problems/idempotency_conflict
            title: Conflict
            status: 409
            detail: Idempotency key was already used for different recipe content.
            request_id: 01JEXAMPLEIDEMPOTENCY
            errorCategory: idempotency_conflict
    StaleRecipeQueryCursor:
      description: The catalog changed after the referenced recipe-query page was read.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
          example:
            type: https://docs.storecipe.example/problems/stale_recipe_query_cursor
            title: Conflict
            status: 409
            detail: Recipe query cursor is stale.
            request_id: 01JEXAMPLESTALECURSOR
            errorCategory: stale_recipe_query_cursor
    StaleRecipeFacetCursor:
      description: The catalog changed after the referenced recipe-facet page was read.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
          example:
            type: https://docs.storecipe.example/problems/stale_recipe_facet_cursor
            title: Conflict
            status: 409
            detail: Recipe facet cursor is stale.
            request_id: 01JEXAMPLESTALEFACET
            errorCategory: stale_recipe_facet_cursor
    ServiceUnavailable:
      description: The catalog could not finish a consistent facet snapshot.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    ImportBurstExceeded:
      description: Import submission burst limit exceeded; retry after the indicated interval.
      headers:
        Retry-After:
          schema: {type: integer, minimum: 1}
        RateLimit-Limit:
          schema: {type: integer, minimum: 1}
        RateLimit-Remaining:
          schema: {type: integer, minimum: 0}
        RateLimit-Reset:
          schema: {type: integer, minimum: 0}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    IngredientNormalizationRateLimited:
      description: >-
        Ingredient normalization burst limit, provider rate limit, or daily AI budget
        exhaustion; retry after the indicated interval when headers are present.
      headers:
        Retry-After:
          schema: {type: integer, minimum: 1}
        RateLimit-Limit:
          schema: {type: integer, minimum: 1}
        RateLimit-Remaining:
          schema: {type: integer, minimum: 0}
        RateLimit-Reset:
          schema: {type: integer, minimum: 0}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
  schemas:
    RatingInput:
      type: object
      required: [value]
      properties:
        value: {type: integer, minimum: 1, maximum: 5}
    Rating:
      type: object
      required: [value]
      properties:
        value: {type: integer, minimum: 1, maximum: 5}
    RecipeCreate:
      type: object
      required: [title, ingredients, instructions]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        sourceUrl: {type: [string, "null"], format: uri, minLength: 1, maxLength: 2083, pattern: '^https?://[^/?#]+(?:[/?#].*)?$', description: 'HTTP(S) URL with a host; Catalog normalizes a host-only URL with a trailing slash.'}
        servings: {type: [integer, "null"], minimum: 1}
        prepMinutes: {type: [integer, "null"], minimum: 0}
        cookMinutes: {type: [integer, "null"], minimum: 0}
        totalMinutes: {type: [integer, "null"], minimum: 0}
        ingredients:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/Ingredient"}
        instructions:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}
        tags:
          type: array
          items: {type: string, minLength: 1, maxLength: 64}
          default: []
    RecipePatch:
      type: object
      minProperties: 1
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        sourceUrl: {type: [string, "null"], format: uri, minLength: 1, maxLength: 2083, pattern: '^https?://[^/?#]+(?:[/?#].*)?$', description: 'HTTP(S) URL with a host; Catalog normalizes a host-only URL with a trailing slash.'}
        servings: {type: [integer, "null"], minimum: 1}
        prepMinutes: {type: [integer, "null"], minimum: 0}
        cookMinutes: {type: [integer, "null"], minimum: 0}
        totalMinutes: {type: [integer, "null"], minimum: 0}
        ingredients:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/Ingredient"}
        instructions:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}
        tags:
          type: array
          items: {type: string, minLength: 1, maxLength: 64}
    Recipe:
      type: object
      required: [id, title, sourceUrl, servings, prepMinutes, cookMinutes, totalMinutes, ingredients, instructions, tags, rating]
      properties:
        id: {type: string, format: uuid}
        title: {type: string, minLength: 1, maxLength: 200}
        sourceUrl: {type: [string, "null"], format: uri, minLength: 1, maxLength: 2083, pattern: '^https?://[^/?#]+(?:[/?#].*)?$', description: 'HTTP(S) URL with a host; Catalog normalizes a host-only URL with a trailing slash.'}
        servings: {type: [integer, "null"], minimum: 1}
        prepMinutes: {type: [integer, "null"], minimum: 0}
        cookMinutes: {type: [integer, "null"], minimum: 0}
        totalMinutes: {type: [integer, "null"], minimum: 0}
        ingredients: {type: array, items: {$ref: "#/components/schemas/Ingredient"}}
        instructions: {type: array, items: {type: string, minLength: 1}}
        tags: {type: array, items: {type: string}}
        rating: {type: [integer, "null"], minimum: 1, maximum: 5}
    Ingredient:
      type: object
      required: [rawText, name]
      properties:
        rawText: {type: string, minLength: 1}
        name: {type: string, minLength: 1, maxLength: 200}
        quantity: {type: [number, "null"], minimum: 0}
        unit: {type: [string, "null"], minLength: 1, maxLength: 64}
    RecipeQueryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Recipe"}}
        nextCursor: {type: [string, "null"]}
    RecipeSort:
      type: string
      enum:
        - rating:asc
        - rating:desc
        - totalMinutes:asc
        - totalMinutes:desc
        - createdAt:asc
        - createdAt:desc
        - updatedAt:asc
        - updatedAt:desc
        - title:asc
        - title:desc
    RecipeFacetBounds:
      type: object
      required: [min, max]
      properties:
        min: {type: integer}
        max: {type: integer}
    RecipeFacetPage:
      type: object
      required: [ingredients, ingredientNextCursor, tags, tagNextCursor, totalMinutes, rating, ratingState, sort]
      properties:
        ingredients:
          type: array
          items: {type: string, minLength: 1, maxLength: 200}
        ingredientNextCursor: {type: [string, "null"], maxLength: 2048}
        tags:
          type: array
          items: {type: string, minLength: 1, maxLength: 64}
        tagNextCursor: {type: [string, "null"], maxLength: 2048}
        totalMinutes:
          anyOf:
            - {$ref: "#/components/schemas/RecipeFacetBounds"}
            - {type: "null"}
        rating: {$ref: "#/components/schemas/RecipeFacetBounds"}
        ratingState:
          type: array
          items: {type: string, enum: [any, rated, unrated]}
        sort:
          type: array
          items: {$ref: "#/components/schemas/RecipeSort"}
    RecipeFacetSelectionsRequest:
      type: object
      additionalProperties: false
      properties:
        ingredients:
          type: array
          maxItems: 32
          default: []
          items: {type: string, minLength: 1, maxLength: 200}
        tags:
          type: array
          maxItems: 16
          default: []
          items: {type: string, minLength: 1, maxLength: 64}
    RecipeFacetSelection:
      type: object
      required: [requestedName, normalizedName, observed]
      properties:
        requestedName: {type: string}
        normalizedName: {type: string}
        observed: {type: boolean}
    RecipeFacetSelectionsResponse:
      type: object
      required: [ingredients, tags]
      properties:
        ingredients:
          type: array
          items: {$ref: "#/components/schemas/RecipeFacetSelection"}
        tags:
          type: array
          items: {$ref: "#/components/schemas/RecipeFacetSelection"}
    ImportAccepted:
      type: object
      required: [jobId, status]
      properties:
        jobId: {type: string, format: uuid}
        status: {const: queued}
    UrlImportRequest:
      type: object
      required: [url]
      properties:
        url: {type: string, format: uri, maxLength: 2048}
        duplicatePolicy:
          type: string
          enum: [warn, allow]
          default: warn
    TextImportRequest:
      type: object
      required: [text]
      properties:
        text: {type: string, minLength: 1, maxLength: 262144}
    ImportJob:
      type: object
      required: [id, status, attemptCount, createdRecipeId, errorCategory, cancellationRequested]
      properties:
        id: {type: string, format: uuid}
        status: {enum: [queued, processing, completed, review_required, failed, cancelled, timed_out]}
        attemptCount: {type: integer, minimum: 0}
        createdRecipeId: {type: [string, "null"], format: uuid}
        errorCategory: {type: [string, "null"]}
        cancellationRequested: {type: boolean}
    IngredientNormalizationRequest:
      type: object
      required: [ingredients]
      properties:
        ingredients:
          type: array
          minItems: 1
          maxItems: 256
          items:
            type: object
            required: [rawText]
            properties:
              rawText: {type: string, minLength: 1, maxLength: 4096}
    IngredientNormalizationResponse:
      type: object
      required: [ingredients]
      properties:
        ingredients:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/NormalizedIngredient"}
    NormalizedIngredient:
      type: object
      required: [rawText, name, canonicalName]
      properties:
        rawText: {type: string, minLength: 1}
        name: {type: string, minLength: 1, maxLength: 200}
        canonicalName: {type: string, minLength: 1, maxLength: 200}
