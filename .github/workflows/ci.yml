name: CI

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: storecipe
          POSTGRES_PASSWORD: storecipe
          POSTGRES_DB: storecipe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U storecipe -d storecipe"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      STORECIPE_TEST_REDIS_URL: redis://localhost:6379/0
      CATALOG_TEST_DATABASE_URL: postgresql+asyncpg://catalog_app:local_catalog_only@localhost:5432/storecipe
      INGESTION_TEST_DATABASE_URL: postgresql+asyncpg://ingestion_app:local_ingestion_only@localhost:5432/storecipe
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.11.28"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --all-packages --group dev --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy packages/storecipe_auth/src services/catalog/src services/ingestion/src services/mcp_gateway/src
      - name: Bootstrap Catalog and Ingestion schemas
        run: |
          docker run --rm --network host -e PGPASSWORD=storecipe postgres:17-alpine \
            psql -h localhost -U storecipe -d storecipe -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE catalog_app LOGIN PASSWORD 'local_catalog_only';" \
            -c "CREATE ROLE ingestion_app LOGIN PASSWORD 'local_ingestion_only';" \
            -c "CREATE SCHEMA catalog AUTHORIZATION catalog_app;" \
            -c "CREATE SCHEMA ingestion AUTHORIZATION ingestion_app;" \
            -c "GRANT CONNECT ON DATABASE storecipe TO catalog_app, ingestion_app;" \
            -c "GRANT CREATE ON DATABASE storecipe TO catalog_app, ingestion_app;"
      - name: Prepare Catalog schema
        run: uv run alembic -c services/catalog/alembic.ini upgrade head
        env:
          CATALOG_DATABASE_URL: postgresql+asyncpg://catalog_app:local_catalog_only@localhost:5432/storecipe
      - name: Prepare Ingestion schema
        run: uv run alembic -c services/ingestion/alembic.ini upgrade head
        env:
          INGESTION_DATABASE_URL: postgresql+asyncpg://ingestion_app:local_ingestion_only@localhost:5432/storecipe
      - run: uv run pytest
      - run: uv run openapi-spec-validator contracts/openapi.yaml
      - run: docker compose config --quiet

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test --runInBand
      - run: pnpm run test:production-bundle
      - run: pnpm run build:web
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-failure-diagnostics
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Build production service images
        run: |
          docker compose build catalog-api ingestion-api mcp-gateway
          docker build -f infra/production/Dockerfile.web \
            --build-arg EXPO_PUBLIC_AUTH0_DOMAIN=tenant.example.auth0.com \
            --build-arg EXPO_PUBLIC_AUTH0_CLIENT_ID=ci-public-client \
            --build-arg EXPO_PUBLIC_AUTH0_AUDIENCE=https://storecipe.example/api \
            --build-arg EXPO_PUBLIC_CATALOG_API_URL=https://storecipe.example \
            --build-arg EXPO_PUBLIC_INGESTION_API_URL=https://storecipe.example .

  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Validate production Compose with synthetic values
        run: |
          set -euo pipefail
          while read -r name; do export "$name=contract-value"; done < <(grep -oE '\$\{[A-Z0-9_]+:\?' infra/production/compose.yaml | cut -c3- | cut -d: -f1 | sort -u)
          export PUBLIC_HOST=storecipe.example PUBLIC_ORIGIN=https://storecipe.example
          docker compose -f infra/production/compose.yaml --profile migration config --quiet
      - name: Validate production Caddy routing
        run: docker run --rm -e PUBLIC_HOST=storecipe.example -v "$PWD/infra/production/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.15.0
      - run: terraform fmt -check -recursive infra/terraform
      - working-directory: infra/terraform/bootstrap
        run: terraform init -backend=false && terraform validate
      - working-directory: infra/terraform/production
        run: terraform init -backend=false && terraform validate
