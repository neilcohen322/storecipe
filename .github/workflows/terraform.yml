name: Terraform

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
      - "services/mcp_gateway/tests/test_workflow_contract.py"
  workflow_dispatch:
    inputs:
      operation:
        description: Preview infrastructure or apply one saved preview
        required: true
        type: choice
        options: [plan, apply]
      machine_type:
        description: Production VM size (used by plan)
        required: true
        default: e2-micro
        type: choice
        options: [e2-micro, e2-small]
      plan_run_id:
        description: Successful plan workflow run ID (required by apply)
        required: false
        type: string
      confirmation:
        description: Enter apply-production for apply
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-terraform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      # hashicorp/setup-terraform v4
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.15.0
      - run: terraform fmt -check -recursive infra/terraform
      - name: Validate bootstrap root without remote state
        working-directory: infra/terraform/bootstrap
        run: terraform init -backend=false && terraform validate
      - name: Validate production root without remote state
        working-directory: infra/terraform/production
        run: terraform init -backend=false && terraform validate

  plan:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'plan'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_billing_account_id: ${{ vars.GCP_BILLING_ACCOUNT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_zone: ${{ vars.GCP_ZONE }}
      TF_VAR_machine_type: ${{ inputs.machine_type }}
      TF_VAR_bucket_suffix: ${{ vars.GCP_BUCKET_SUFFIX }}
      TF_VAR_workload_identity_pool_name: ${{ vars.GCP_WIF_POOL_NAME }}
      TF_VAR_github_owner: ${{ github.repository_owner }}
      TF_VAR_github_repository: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.15.0
      # google-github-actions/auth v3
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
      - name: Require public infrastructure inputs
        env:
          STATE_BUCKET: ${{ vars.GCP_TERRAFORM_STATE_BUCKET }}
        run: |
          set -euo pipefail
          for name in TF_VAR_project_id TF_VAR_billing_account_id TF_VAR_region TF_VAR_zone TF_VAR_bucket_suffix TF_VAR_workload_identity_pool_name STATE_BUCKET; do
            [[ -n "${!name:-}" ]] || { echo "Missing required variable: $name" >&2; exit 1; }
          done
      - name: Create saved production plan
        working-directory: infra/terraform/production
        env:
          STATE_BUCKET: ${{ vars.GCP_TERRAFORM_STATE_BUCKET }}
        run: |
          set -euo pipefail
          sed "s/REPLACE_WITH_BOOTSTRAP_STATE_BUCKET/$STATE_BUCKET/" backend.tf.example > backend.tf
          terraform init
          terraform plan -input=false -out=production.tfplan
          sha256sum production.tfplan > production.tfplan.sha256
          terraform show -no-color production.tfplan > production-plan.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-tfplan-${{ github.run_id }}
          path: |
            infra/terraform/production/production.tfplan
            infra/terraform/production/production.tfplan.sha256
            infra/terraform/production/production-plan.txt
          if-no-files-found: error
          retention-days: 7

  apply:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'apply'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Verify explicit apply approval
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == "apply-production" ]] || { echo "Incorrect confirmation" >&2; exit 1; }
          [[ "$PLAN_RUN_ID" =~ ^[0-9]+$ ]] || { echo "A numeric plan_run_id is required" >&2; exit 1; }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.15.0
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
      # actions/download-artifact v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: production-tfplan-${{ inputs.plan_run_id }}
          path: infra/terraform/production
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.plan_run_id }}
      - name: Apply only the downloaded reviewed plan
        working-directory: infra/terraform/production
        env:
          STATE_BUCKET: ${{ vars.GCP_TERRAFORM_STATE_BUCKET }}
        run: |
          set -euo pipefail
          sha256sum --check production.tfplan.sha256
          sed "s/REPLACE_WITH_BOOTSTRAP_STATE_BUCKET/$STATE_BUCKET/" backend.tf.example > backend.tf
          terraform init
          terraform apply -input=false production.tfplan
