[project]
name = "storecipe-mcp-gateway"
version = "0.1.0"
description = "Storecipe standalone MCP gateway"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141,<0.142",
    "httpx>=0.28,<0.29",
    "mcp>=1.26,<2",
    "pydantic>=2.10,<2.12",
    "pydantic-settings>=2.10,<3",
    "storecipe-auth",
    "uvicorn[standard]>=0.35,<0.36",
]

[tool.uv.sources]
storecipe-auth = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storecipe_mcp"]
