[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
version_table = alembic_version_ingestion
version_table_schema = ingestion
sqlalchemy.url = postgresql+asyncpg://ingestion_app:local_ingestion_only@localhost:5432/storecipe

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
