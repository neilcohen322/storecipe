[project]
name = "storecipe-ingestion"
version = "0.1.0"
description = "Storecipe asynchronous recipe ingestion service"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiohttp>=3.14,<4",
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<0.31",
    "beautifulsoup4>=4.14,<5",
    "celery[redis]>=5.5,<6",
    "cryptography>=45,<50",
    "fastapi>=0.116,<0.117",
    "limits>=5.8,<6",
    "pydantic>=2.10,<2.12",
    "pydantic-settings>=2.10,<3",
    "pyjwt[crypto]>=2.10,<3",
    "redis>=6.2,<7",
    "sqlalchemy[asyncio]>=2.0.41,<3",
    "storecipe-auth",
    "uvicorn[standard]>=0.35,<0.36",
    "yarl>=1.22,<2",
]

[tool.uv.sources]
storecipe-auth = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]
