[project]
name = "storecipe-catalog"
version = "0.1.0"
description = "Storecipe catalog REST service"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<0.31",
    "fastapi>=0.141,<0.142",
    "limits>=5.8,<6",
    "pydantic>=2.10,<2.12",
    "pydantic-settings>=2.10,<3",
    "redis>=6.2,<7",
    "sqlalchemy[asyncio]>=2.0.41,<3",
    "storecipe-auth",
    "uvicorn[standard]>=0.35,<0.36",
]

[tool.uv.sources]
storecipe-auth = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalog"]
