[project]
name = "storecipe-store"
version = "0.1.0"
description = "Personal recipe storage with an MCP server"
requires-python = ">=3.13,<3.14"
dependencies = [
    "mcp>=1.26,<2",
    "pydantic>=2.10,<2.12",
    "uvicorn[standard]>=0.35,<0.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storecipe_store"]
